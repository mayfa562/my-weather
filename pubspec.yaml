name: my_weather
description: A polished multilingual weather app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  
  
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  provider: ^6.1.2
  http: ^1.2.1
  geolocator: ^14.0.3
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.0
  flutter_map: ^8.1.1
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  shared_preferences: ^2.3.2

  # UI polish
  google_fonts: ^8.2.1
  shimmer: ^4.0.0
  animations: ^3.0.0

  # Animated weather icons
  lottie: ^3.5.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/weather_icons/
    - .env
